name: iOS Build

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - run: flutter build ios --release --no-codesign