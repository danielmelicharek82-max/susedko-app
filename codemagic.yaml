workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter clean
        script: flutter clean

      - name: Get Flutter packages
        script: flutter pub get

      - name: Clean CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --clean-install
          find . -name "*.sh" -path "*/Pods/*" -exec chmod +x {} \;
          cd ..

      - name: Build iOS archive
        script: |
          cp ios/AuthKey.p8 /tmp/AuthKey.p8
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path $(find $CM_BUILD_DIR/output -name "*.ipa") \
            --key-id "S6JD8KBSNV" \
            --issuer-id "08941c62-c68a-462c-9204-4dad33c5bcf0" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight

    artifacts:
      - $CM_BUILD_DIR/output/**/*.ipa