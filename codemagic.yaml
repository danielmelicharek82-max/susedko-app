workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120

    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA (SIGNED AUTOMATICALLY)
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true