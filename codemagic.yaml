- name: Upload to TestFlight
        script: |
          cd $CM_BUILD_DIR/ipa
          unzip -o susedko.ipa -d Payload_dir

          # Podpiš každý binárny súbor vo frameworks
          find Payload_dir/Payload/Runner.app/Frameworks -type f -not -name "*.plist" -not -name "*.nib" | while read binary; do
            codesign --force --sign "Apple Distribution: Daniel Melicharek (SQ2VV7TA67)" \
              --preserve-metadata=identifier,entitlements \
              "$binary" || true
          done

          # Podpiš frameworks
          find Payload_dir/Payload/Runner.app/Frameworks -name "*.framework" | while read fw; do
            codesign --force --sign "Apple Distribution: Daniel Melicharek (SQ2VV7TA67)" \
              --preserve-metadata=identifier,entitlements \
              "$fw" || true
          done

          # Podpiš hlavnú app
          codesign --force --sign "Apple Distribution: Daniel Melicharek (SQ2VV7TA67)" \
            --preserve-metadata=identifier,entitlements \
            Payload_dir/Payload/Runner.app

          # Zbal späť
          cd Payload_dir
          zip -r ../susedko_final.ipa Payload
          cd ..

          app-store-connect publish \
            --path $CM_BUILD_DIR/ipa/susedko_final.ipa \
            --key-id "S6JD8KBSNV" \
            --issuer-id "08941c62-c68a-462c-9204-4dad33c5bcf0" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight